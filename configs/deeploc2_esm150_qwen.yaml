dataset: "DeepLoc2"
root: "data/deeploc"
esm_file: "seq_embed_esm2_t30_150m_ur50d.pt"
# text_features_path is read directly by the model (relative to cwd is fine)
text_features_path: "data/deeploc/class_text_qwen3_embedding_0_6b.pt"
img_dim: 640
shots: 16
seed: 42

# Training
epochs: 400
lr: 0.0001
wd: 0.00001
batch_size: 64
eval_freq: 50
num_workers: 2

# Model / Flow
fm_type: "geodesic"
inv_fm_type: "adapter"
use_op: True
pretrained_op: ""
text_adapter: True
ada_depth: 4
ada_dim: 1536
ada_t_dim: 256
train_time_samples: 1
alpha: 0.0
use_context: False

# Precomputed encoders
txt_src: "FEAT"
txt_model: "Qwen/Qwen3-Embedding-0.6B"
img_src: "FEAT"
img_model: "facebook/esm2_t30_150M_UR50D"
